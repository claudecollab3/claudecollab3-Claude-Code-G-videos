# Reverse-proxies /api (including the notifications WebSocket) to the
# backend container, and serves the built SPA for everything else with
# client-side routing fallback.
#
# Note: `Connection "upgrade"` is sent unconditionally rather than only for
# upgrade requests (the textbook-correct version needs an nginx `map`
# directive in the http{} context, which isn't available from a single
# conf.d/*.conf server block without replacing the base image's nginx.conf
# entirely) -- harmless for plain HTTP requests, which ignore it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
